---
layout: base.njk
title: Projects
permalink: /projects/
---
<!-- ABOUT -->
                <article class="projects active" data-page="projects">
                    <header>
                        <h2 class="h2 article-title">Projects</h2>
                    </header>

                    <section class="projects">
                        <ul class="filter-list">
                            <li class="filter-item">
                                <button class="active" data-filter-btn>
                                    All
                                </button>
                            </li>
                            <li class="filter-item">
                                <button data-filter-btn>Tools</button>
                            </li>
                            <li class="filter-item">
                                <button data-filter-btn>Models</button>
                            </li>
                            <li class="filter-item">
                                <button data-filter-btn>Analytics</button>
                            </li>
                            <li class="filter-item">
                                <button data-filter-btn>Knowledge</button>
                            </li>
                        </ul>

                        <!-- The select box is kept in HTML but can be hidden with CSS if not needed on desktop -->
                        <div class="filter-select-box">
                            <button class="filter-select" data-select>
                                <div class="select-value" data-selecct-value>
                                    Select category
                                </div>
                                <div class="select-icon">
                                    <!-- Ionicon would require an external script, using text as fallback -->
                                    <span>&#9660;</span>
                                </div>
                            </button>
                            <ul class="select-list">
                                <li class="select-item">
                                    <button data-select-item>All</button>
                                </li>
                                <li class="select-item">
                                    <button data-select-item>Tools</button>
                                </li>
                                <li class="select-item">
                                    <button data-select-item>Models</button>
                                </li>
                                <li class="select-item">
                                    <button data-select-item>Analytics</button>
                                </li>
                                <li class="select-item">
                                    <button data-select-item>Knowledge</button>
                                </li>
                            </ul>
                        </div>

                        <div class="projects-grid">
                            <ul class="project-list" id="project-list">
                                {% for project in projects %}
                                <li class="project-item active" data-filter-item data-category="{{ project.category | default('tools') | lower }}">
                                    <a href="{{ project.url }}">
                                        <figure class="project-img">
                                            <div class="project-item-icon-box">
                                                <ion-icon name="eye-outline"></ion-icon>
                                            </div>
                                            <img src="{{ project.image }}" alt="{{ project.alt | default(project.title) }}" loading="lazy" />
                                        </figure>
                                        <h3 class="project-title">{{ project.title }}</h3>
                                        <p class="project-category">{{ project.category_desc | default(project.category) }}</p>
                                    </a>
                                </li>
                                {% endfor %}
                            </ul>
                        </div>
                    </section>
                </article>
